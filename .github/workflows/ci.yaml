name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - cmd/**
      - disk/**
      - internal/**
      - journal/**
      - naming/**
      - retain/**
      - sink/**
      - size/**
      - source/**
      - spool/**
      - trigger/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - go.work
      - main.go
      - scripts/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

jobs:
  # Outside the image on purpose: `go mod tidy` wants the network, and the build
  # stage has already downloaded exactly what the current go.mod says, so asking
  # it there would prove nothing and fail for the wrong reason.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sink/s3/go.sum
            sink/sftp/go.sum
      - name: every module says what it needs
        run: |
          set -eux
          for m in . sink/s3 sink/sftp; do (cd "$m" && go mod tidy -diff); done

  # Each module, built as somebody who imports it would build it: without the
  # workspace, against the versions its own go.mod records.
  #
  # This is the one thing the workspace hides. The binary imports the sinks and
  # the sinks import the root, so after a change to `sink` or `size` each
  # submodule is pointing at a root that predates it. From a checkout that is
  # invisible and harmless; to somebody who runs `go get` on one of them it is
  # not. This job is what says so.
  modules:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sink/s3/go.sum
            sink/sftp/go.sum
      - name: each module on its own
        run: |
          set -eux
          for m in . sink/s3 sink/sftp; do (cd "$m" && go build ./...); done

  build:
    runs-on: ubuntu-latest
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/bake-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64
            app.platform=linux/arm64
            app.output=type=registry

name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - cmd/**
      - disk/**
      - journal/**
      - naming/**
      - retain/**
      - sink/**
      - source/**
      - spool/**
      - trigger/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - main.go
      - scripts/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

jobs:
  # Outside the image on purpose: `go mod tidy` wants the network, and the build
  # stage has already downloaded exactly what the current go.mod says, so asking
  # it there would prove nothing and fail for the wrong reason.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod tidy -diff

  build:
    runs-on: ubuntu-latest
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/bake-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64
            app.platform=linux/arm64
            app.output=type=registry

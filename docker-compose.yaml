services:
  app:
    image: ghcr.io/heojeongbo/wick:${REVISION:-local}
    command: [run]

    network_mode: host
    privileged: true

    volumes:
      - ./wick.yaml:/wick.yaml:ro

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 64M
        reservations:
          cpus: "2"
          memory: 32M
